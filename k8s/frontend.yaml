apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecocycle-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ecocycle-frontend
  template:
    metadata:
      labels:
        app: ecocycle-frontend
    spec:
      containers:
        - name: frontend
          image: ecocycle-frontend:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: ecocycle-frontend
spec:
  selector:
    app: ecocycle-frontend
  ports:
    - port: 80
      targetPort: 80
  type: NodePort
